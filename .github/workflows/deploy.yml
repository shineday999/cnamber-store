name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run build
        env:
          NODE_VERSION: "22"
      - name: Flatten dist/client static assets for wrangler Pages
        run: |
          if [ -d dist/client ]; then
            echo "Before flatten: dist/ top-level"
            ls -1 dist/ | head -10
            cp -r dist/client/. dist/
            rm -rf dist/client
            echo ""
            echo "After flatten: dist/ top-level"
            ls -1 dist/ | head -20
            echo ""
            echo "Spot check:"
            test -f dist/_astro/page-ssr.D7vGzN-b.css && echo "  ✓ dist/_astro/page-ssr.D7vGzN-b.css"
            test -f dist/images/banners/slide-1.jpg && echo "  ✓ dist/images/banners/slide-1.jpg"
            test -f dist/favicon.ico && echo "  ✓ dist/favicon.ico"
          else
            echo "dist/client/ not found, skip flatten"
          fi
      - run: pnpm test

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      deployments: "write"
    steps:
      - uses: actions/checkout@v4
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=cnamber-store --branch=main --commit-dirty=true

  preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      deployments: "write"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@v4
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy preview to Cloudflare Pages via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=cnamber-store --branch=${{ github.head_ref }} --commit-dirty=true
