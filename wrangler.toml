name = "cnamber-store"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Environment variables (placeholder — will be populated in Phase 1+)
# [vars]
# PUBLIC_SITE_URL = "https://cnamber.ccwu.cc"

# D1 binding (Phase 2+)
[[d1_databases]]
binding = "DB"
database_name = "cnamber-store"
database_id = "adbf8443-b2ab-4042-9781-d36588a8f5b8"

# R2 binding (Wave 21: product cover images)
[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "cnamber-store-images"

# KV binding (Phase 3+ i18n)
[[kv_namespaces]]
binding = "I18N"
id = "4c8f1d2d42c040a9958d3c133426d896"

[[kv_namespaces]]
binding = "SESSION"
id = "17d4d35864084de1a9ee85c46505ec7e"

# Cloudflare Pages integration (set automatically when deploying)
# [[unsafe]]
# binding = "ASSETS"
# type = "assets"
